<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1442">
<title>題海遠征</title>
<style>
:root{
  --ink:#071445;
  --panel-a:#1f4cc0;
  --panel-b:#0f2a7c;
  --edge:#8fd0ff;
  --gold:#ffd54a;
  --ok:#1f9d55;
  --bad:#c0352b;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1442;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#fff;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;margin:0}
.hidden{display:none !important}

#app{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- 共用面板 ---------- */
.panel{background:linear-gradient(var(--panel-a),var(--panel-b));border:3px solid var(--edge);border-radius:10px;
  box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px #2d63e0,0 4px 0 2px rgba(0,0,0,.35)}
.btn{display:block;width:100%;padding:13px 16px;border-radius:10px;font-size:17px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(#ffe27a,#f0a010);color:#3a2300;border:3px solid #fff3b0;
  box-shadow:0 0 0 2px #6a3f00,0 4px 0 2px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(2px)}
.btn.sub{background:linear-gradient(#3a63d6,#1b3a9c);color:#fff;border-color:var(--edge);box-shadow:0 0 0 2px var(--ink),0 4px 0 2px rgba(0,0,0,.4);text-shadow:none}
.btn.danger{background:linear-gradient(#e0574b,#a52a20);color:#fff;border-color:#ffb3aa;box-shadow:0 0 0 2px #4a0d08,0 4px 0 2px rgba(0,0,0,.4);text-shadow:none}
.btn[disabled]{opacity:.5;filter:grayscale(.6)}

/* ---------- 開始畫面 ---------- */
#start{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 18px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 20px) calc(var(--safe-l) + 16px);
  background:
   radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#cfe6ff,transparent),
   radial-gradient(1px 1px at 140px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 130px,#fff,transparent),
   linear-gradient(#070b2e,#12308a 55%,#2a55b8);
  background-size:160px 160px,160px 160px,160px 160px,160px 160px,100% 100%}
#start .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.title{text-align:center;margin:6px 0 0}
.title h1{margin:0;font-size:44px;letter-spacing:6px;font-weight:900;
  background:linear-gradient(#fff7c2,#ffc933 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a2d00) drop-shadow(0 0 12px rgba(255,170,0,.55))}
.title p{margin:4px 0 0;font-size:13px;letter-spacing:2px;color:#bcd8ff}
.foes{display:flex;justify-content:space-between;align-items:flex-end;gap:2px;padding:0 2px;height:84px}
.foes img{max-height:100%;max-width:19%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.intro{padding:12px 14px;font-size:14px;line-height:1.7}
.intro ul{margin:6px 0 0;padding-left:18px}
.intro li{margin:2px 0}
.bankinfo{padding:10px 14px;font-size:13px;line-height:1.6;color:#dbe9ff}
.bankinfo b{color:var(--gold)}
.warn{color:#ffd9a0}

/* ---------- 戰鬥畫面 ---------- */
#battle{background:#c79a63}
#stage{position:relative;flex:0 0 auto;height:clamp(205px,34dvh,330px);overflow:hidden;
  padding-top:var(--safe-t);box-sizing:content-box;
  background:
   radial-gradient(ellipse 60% 30% at 82% 18%,rgba(140,190,255,.55),transparent 70%),
   radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#cfe6ff,transparent),
   radial-gradient(1px 1px at 140px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 120px,#fff,transparent),
   linear-gradient(#070b2e 0%,#10297c 55%,#2f62c8 72%)}
#stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 38px,transparent 38px 76px),linear-gradient(#e0b27a,#b98450);
  border-top:3px solid #f0c890}
#stage .stage-inner{position:absolute;inset:0;padding-top:0}
.hud{position:absolute;top:calc(var(--safe-t) + 7px);width:43.5%;padding:5px 8px 6px;z-index:5;font-size:12px}
.hud .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.hud .row{display:flex;align-items:center;gap:6px;margin-top:3px}
.hud .hp{font-size:11px;font-weight:800;white-space:nowrap}
.hud-enemy{left:calc(var(--safe-l) + 7px)}
.hud-player{right:calc(var(--safe-r) + 7px)}
.bar{flex:1;height:11px;background:#06103a;border:2px solid #000;border-radius:3px;overflow:hidden;min-width:34px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#7dff7d,#1fb81f);transition:width .55s ease-out}
.bar i.mid{background:linear-gradient(#ffe97a,#e0b300)}
.bar i.low{background:linear-gradient(#ff8a80,#d32f2f)}
#pauseBtn{position:absolute;top:calc(var(--safe-t) + 12px);left:50%;transform:translateX(-50%);z-index:6;width:30px;height:30px;
  border-radius:50%;background:rgba(5,12,50,.75);border:2px solid var(--edge);font-size:12px;padding:0;line-height:1}
.actor{position:absolute;display:flex;align-items:flex-end;justify-content:center;z-index:2}
#enemyWrap{left:1%;bottom:5%;width:60%;height:70%}
#heroWrap{right:4%;bottom:4%;width:30%;height:62%}
.bob{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;animation:bob 2.4s ease-in-out infinite}
#heroWrap .bob{animation-duration:2.9s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.actor img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 100%;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
#enemyImg{transform:scale(var(--es,1))}
#heroWrap.charged img{filter:drop-shadow(0 0 6px #ffd54a) drop-shadow(0 0 14px #ff9a00)}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.arrow{position:absolute;left:0;top:0;width:58px;height:6px;margin-top:-3px;transform-origin:0 50%;border-radius:3px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#ffe9a0 30%,#fff 100%);box-shadow:0 0 8px #ffd54a}
.arrow::after{content:"";position:absolute;right:-9px;top:-4px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.arrow.c3{height:9px;margin-top:-4.5px;width:74px;background:linear-gradient(90deg,rgba(255,200,0,0),#ffb300 40%,#fff);box-shadow:0 0 14px #ff9a00}
.arrow.c5{height:13px;margin-top:-6.5px;width:96px;background:linear-gradient(90deg,rgba(255,60,0,0),#ff5a1f 40%,#fff);box-shadow:0 0 20px #ff3d00,0 0 40px #ff9a00}
.burst{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,225,120,.95) 28%,rgba(255,120,0,0) 70%)}
.burst.dark{background:radial-gradient(circle,#fff 0%,rgba(255,110,160,.9) 25%,rgba(150,30,200,0) 70%)}
.slash{position:absolute;width:120px;height:7px;margin:-3px 0 0 -60px;border-radius:4px;
  background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:27px;white-space:nowrap;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 6px rgba(0,0,0,.6)}
.float.dmg{color:#ffec6b}.float.dmg.big{color:#ff9a3d;font-size:34px}.float.hurt{color:#ff6b6b}.float.heal{color:#6bff9a}
.float.combo{color:#ffd54a;font-size:19px;letter-spacing:1px}
#flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:rgba(255,30,30,.55)}
#toast{position:absolute;left:50%;top:calc(var(--safe-t) + 80px);transform:translateX(-50%);z-index:8;max-width:94%;
  padding:6px 12px;border-radius:8px;background:rgba(5,12,50,.86);border:2px solid var(--edge);font-size:13px;font-weight:700;
  text-align:center;line-height:1.4;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#chips{position:absolute;left:calc(var(--safe-l) + 7px);bottom:6px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(5,12,50,.82);border:2px solid var(--edge);white-space:nowrap}
.chip.hot{border-color:#ffb300;color:#ffd54a}
.chip.max{border-color:#ff5a1f;color:#ff8a4a;box-shadow:0 0 8px #ff5a1f}

#qarea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px 8px 0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 46px,transparent 46px 92px),linear-gradient(#cf9f68,#b98450)}
#qscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 2px 8px}
#qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.tag{padding:2px 10px;border-radius:8px 8px 0 0;font-size:12px;font-weight:800;background:linear-gradient(var(--panel-a),var(--panel-b));border:2px solid var(--edge);border-bottom:0}
.tag.cat{background:#2a2160;border-color:#b9a5ff}
#qtext{padding:12px 13px;font-size:17px;line-height:1.65;font-weight:600}
#feedback{margin-top:9px}
.fb{padding:10px 12px;font-size:14px;line-height:1.6}
.fb .banner{display:inline-block;padding:2px 14px;border-radius:6px;font-size:18px;font-weight:900;letter-spacing:2px;margin-bottom:5px}
.fb .banner.ok{background:linear-gradient(#37c878,#177a42);border:2px solid #b4ffd0}
.fb .banner.bad{background:linear-gradient(#e0574b,#8d1f17);border:2px solid #ffb3aa}
.fb .lab{color:var(--gold);font-weight:800}
.fb .ans{display:inline-block;padding:0 9px;margin-left:4px;border-radius:6px;background:#ffe9a0;color:#3a2300;font-weight:900}
.fb .exp{margin-top:4px;color:#e8f1ff}

#bottom{flex:0 0 auto;padding:6px 8px calc(var(--safe-b) + 8px);background:linear-gradient(#a66f3c,#8a5a2e);border-top:3px solid #6a4020}
#opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:50px;padding:7px 11px;font-size:15px;line-height:1.4;font-weight:600;
  background:linear-gradient(var(--panel-a),var(--panel-b));border:3px solid var(--edge);border-radius:10px;
  box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px #2d63e0,0 3px 0 2px rgba(0,0,0,.35)}
.opt:active:not([disabled]){transform:translateY(2px)}
.opt .lt{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#ffe27a,#f0a010);color:#3a2300;font-weight:900;font-size:15px;border:2px solid #fff3b0}
.opt.ok{background:linear-gradient(#2fbf6c,#157a40);border-color:#b4ffd0}
.opt.bad{background:linear-gradient(#e0574b,#8d1f17);border-color:#ffb3aa}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
#actrow{display:flex;gap:8px;align-items:center;margin-top:7px;min-height:46px}
#bookBtn{flex:0 0 auto;padding:0 12px;height:46px;border-radius:10px;font-size:13px;font-weight:800;background:linear-gradient(#7a4cd6,#4a2a9c);
  border:3px solid #c9b0ff;box-shadow:0 0 0 2px #1d0d4a,0 3px 0 2px rgba(0,0,0,.35);white-space:nowrap}
#infoTx{flex:1;text-align:center;font-size:13px;font-weight:700;color:#fff3d6;text-shadow:0 1px 0 rgba(0,0,0,.5);line-height:1.4}
#nextBtn{flex:1;height:46px;padding:0 10px;font-size:17px}

/* ---------- 彈窗 ---------- */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px);background:rgba(3,8,30,.78)}
#modal .box{width:min(94vw,460px);max-height:88dvh;display:flex;flex-direction:column;padding:14px}
#modal h2{margin:0 0 8px;font-size:21px;text-align:center;letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 #000}
#modal .body{white-space:pre-line;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:14.5px;line-height:1.7;min-height:0}
#modal .acts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed rgba(143,208,255,.35)}
.kv span:last-child{font-weight:800;color:var(--gold)}

/* ---------- 結算畫面 ---------- */
#result{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 16px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 22px) calc(var(--safe-l) + 14px);
  background:linear-gradient(#070b2e,#12308a 60%,#2a55b8)}
#result .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#result h1{margin:4px 0 0;text-align:center;font-size:32px;letter-spacing:3px;font-weight:900}
#result h1.win{color:var(--gold);text-shadow:0 3px 0 #5a2d00,0 0 16px rgba(255,170,0,.7)}
#result h1.lose{color:#ff8a80;text-shadow:0 3px 0 #4a0d08}
#result .sub{text-align:center;color:#cfe3ff;font-size:14px;margin:-4px 0 0}
.stats{padding:10px 14px;font-size:14.5px}
.sec{margin:6px 0 -4px;font-size:16px;font-weight:900;color:var(--gold);letter-spacing:1px}
.stg{padding:7px 12px;font-size:13.5px;line-height:1.55}
.stg b.w{color:#7dffb0}.stg b.l{color:#ff9d94}
.rv{padding:10px 12px;font-size:14px;line-height:1.55;margin-bottom:10px}
.rv .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px;font-size:12px;font-weight:800}
.rv .cnt{margin-left:auto;padding:1px 9px;border-radius:999px;background:#c0352b;border:2px solid #ffb3aa}
.rv .q{font-weight:700;margin-bottom:6px}
.rv .o{padding:4px 8px;margin:3px 0;border-radius:6px;background:rgba(0,0,0,.25);display:flex;gap:6px}
.rv .o.ok{background:rgba(47,191,108,.45)}
.rv .o.bad{background:rgba(224,87,75,.5)}
.rv .o .m{flex:0 0 auto;font-weight:900}
.rv .e{margin-top:5px;color:#e8f1ff}
.empty{padding:18px;text-align:center;color:#cfe3ff}
</style>
</head>
<body>
<div id="app">

  <!-- 開始畫面 -->
  <section id="start" class="screen">
    <div class="wrap">
      <div class="title"><h1>題海遠征</h1><p>RPG × 四選一問答 × 回合制戰鬥</p></div>
      <div class="foes" id="foes"></div>
      <div class="panel intro">
        冒險者闖入充滿考題的魔幻世界，必須以答題擊退一路阻擋的魔物，最終挑戰題海魔神。
        <ul>
          <li>答對：冒險者射箭攻擊（連續答對 3 題傷害 150、5 題以上 200）</li>
          <li>答錯：敵人立刻反擊，並顯示正確答案</li>
          <li>擊敗敵人後恢復 30% HP，共五個階段</li>
          <li>HP 歸零即戰敗；擊敗終極閱卷者即通關</li>
        </ul>
      </div>
      <div class="panel bankinfo" id="bankinfo">題庫載入中…</div>
      <button class="btn" id="startBtn" disabled>開始冒險</button>
    </div>
  </section>

  <!-- 戰鬥畫面 -->
  <section id="battle" class="screen hidden">
    <div id="stage">
      <div class="stage-inner">
        <div class="hud panel hud-enemy"><div class="nm" id="eName"></div><div class="row"><div class="bar"><i id="eBar"></i></div></div><div class="hp" id="eHp"></div></div>
        <div class="hud panel hud-player"><div class="nm">冒險者</div><div class="row"><div class="bar"><i id="pBar"></i></div></div><div class="hp" id="pHp"></div></div>
        <button id="pauseBtn" aria-label="暫停">⏸</button>
        <div id="enemyWrap" class="actor"><div class="bob"><img id="enemyImg" alt=""></div></div>
        <div id="heroWrap" class="actor"><div class="bob"><img id="heroImg" alt=""></div></div>
        <div id="fx"></div>
        <div id="flash"></div>
        <div id="toast"></div>
        <div id="chips"><span class="chip" id="chipStage"></span><span class="chip hidden" id="chipCombo"></span></div>
      </div>
    </div>
    <div id="qarea">
      <div id="qscroll">
        <div id="qmeta"></div>
        <div class="panel" id="qtext"></div>
        <div id="feedback"></div>
      </div>
    </div>
    <div id="bottom">
      <div id="opts"></div>
      <div id="actrow">
        <button id="bookBtn">📖 錯題 0</button>
        <div id="infoTx"></div>
        <button class="btn hidden" id="nextBtn">▶ 下一題</button>
      </div>
    </div>
  </section>

  <!-- 結算畫面 -->
  <section id="result" class="screen hidden"><div class="wrap" id="resultWrap"></div></section>

</div>
<div id="modal" class="hidden"></div>

<script>
(function(){
'use strict';

/* ================= 設定（數值集中在這裡，方便調整） ================= */
const CFG = {
  playerMaxHp: 600,
  healRate: 0.3,
  baseDmg: 100,
  combo: [ {at:5, dmg:200}, {at:3, dmg:150} ],   // 由高到低
  enemies: [
    {name:'錯題小鬼',            hp:400,  atk:60,  img:'e1', scale:0.80},
    {name:'題海戰將',            hp:600,  atk:80,  img:'e2', scale:0.90},
    {name:'考古邪神',            hp:800,  atk:100, img:'e3', scale:0.95},
    {name:'閱卷魔君',            hp:1000, atk:140, img:'e4', scale:1.00},
    {name:'題海魔神・終極閱卷者', hp:1500, atk:200, img:'e5', scale:1.05}
  ]
};

/* ================= 內嵌資料 ================= */

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const LET = 'ABCDEFGH';
const fmt = n => Number(n).toLocaleString('en-US');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function anim(node, kf, opt){ try{ return node.animate(kf, Object.assign({fill:'none'}, opt)).finished.catch(()=>{}); }catch(e){ return sleep((opt&&opt.duration)||0); } }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 題庫 ================= */
function normalizeBank(raw){
  const out = []; let skipped = 0;
  ((raw && raw.questions) || []).forEach((q, idx) => {
    try{
      const opts = (q.options || []).map(String);
      if(opts.length < 2 || opts.length > LET.length || !q.question) throw 0;
      const arr = Array.isArray(q.answer) ? q.answer : [q.answer];
      const ans = [...new Set(arr.map(a => LET.indexOf(String(a).trim().toUpperCase())))].filter(i => i >= 0 && i < opts.length);
      if(!ans.length) throw 0;
      out.push({ id: (q.id != null ? q.id : idx+1), category: q.category || '', question: String(q.question),
                 options: opts, answers: ans, explanation: q.explanation ? String(q.explanation) : '' });
    }catch(e){ skipped++; }
  });
  return { exam: (raw && raw.exam) || '', subject: (raw && raw.subject) || '', questions: out, skipped };
}
let BANK = null, BANK_SRC = '內嵌題庫';

async function loadBank(){
  BANK = normalizeBank(EMBEDDED_BANK);
  // 若同資料夾放了 questions.json（需透過網站開啟），優先使用，方便日後擴充題庫
  try{
    const r = await fetch('questions.json?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const nb = normalizeBank(await r.json());
      if(nb.questions.length){ BANK = nb; BANK_SRC = 'questions.json'; }
    }
  }catch(e){ /* 讀不到就用內嵌題庫 */ }
}

/* ================= 狀態 ================= */
let G = null;
let toastTimer = null;

function newGame(){
  G = { hp: CFG.playerMaxHp, stage: 0, enemyHp: 0, enemyMax: 0,
        streak: 0, maxStreak: 0, round: 0, total: 0, correct: 0, wrong: 0,
        wrongLog: [], stageStats: [], cur: null, curStats: null,
        deck: [], lastQ: -1, reshuffles: 0,
        locked: true, busy: false, pending: null, ended: false };
  refillDeck();
  G.curStats = newStageStats();
}
function newStageStats(){ return { rounds:0, correct:0, wrong:0, taken:0 }; }
function refillDeck(){
  const d = shuffle(BANK.questions.map((_, i) => i));
  if(d.length > 1 && d[d.length-1] === G.lastQ){ const j = Math.floor(Math.random()*(d.length-1)); [d[d.length-1], d[j]] = [d[j], d[d.length-1]]; }
  G.deck = d;
}

/* ================= 畫面切換 ================= */
function showScreen(id){
  ['start','battle','result'].forEach(s => $('#'+s).classList.toggle('hidden', s !== id));
}

/* ================= 彈窗 ================= */
function showModal({title, body, actions}){
  return new Promise(resolve => {
    const m = $('#modal'); m.innerHTML = '';
    const box = el('div', 'box panel');
    if(title) box.appendChild(el('h2', '', title));
    const b = el('div', 'body');
    if(typeof body === 'string') b.textContent = body; else if(body) b.appendChild(body);
    box.appendChild(b);
    const acts = el('div', 'acts');
    (actions || [{label:'確定', value:'ok'}]).forEach(a => {
      const btn = el('button', 'btn ' + (a.cls || ''), a.label);
      btn.addEventListener('click', () => { m.classList.add('hidden'); m.innerHTML = ''; resolve(a.value); });
      acts.appendChild(btn);
    });
    box.appendChild(acts); m.appendChild(box); m.classList.remove('hidden');
  });
}

/* ================= HUD ================= */
function setBar(bar, hpEl, hp, max){
  const p = Math.max(0, hp / max * 100);
  bar.style.width = p + '%';
  bar.className = p > 50 ? '' : (p > 25 ? 'mid' : 'low');
  hpEl.textContent = 'HP ' + fmt(Math.max(0,hp)) + ' / ' + fmt(max);
}
function updateChips(){
  $('#chipStage').textContent = '第 ' + (G.stage+1) + ' / ' + CFG.enemies.length + ' 階段 ・ 回合 ' + G.curStats.rounds;
  const c = $('#chipCombo');
  if(G.streak >= 2){
    c.classList.remove('hidden');
    c.textContent = '🔥 連擊 ' + G.streak;
    c.className = 'chip' + (G.streak >= 5 ? ' max' : (G.streak >= 3 ? ' hot' : ''));
  } else c.classList.add('hidden');
}
function updateInfo(){
  $('#infoTx').textContent = '已答 ' + G.total + ' 題 ・ 牌庫剩 ' + G.deck.length + ' 題';
  $('#bookBtn').textContent = '📖 錯題 ' + uniqueWrong().length;
}
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1800);
}

/* ================= 特效 ================= */
function pos(node){
  const s = $('#stage').getBoundingClientRect(), r = node.getBoundingClientRect();
  return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2, w: r.width, h: r.height };
}
function floatText(x, y, text, cls){
  const f = el('div', 'float ' + cls, text); f.style.left = x + 'px'; f.style.top = y + 'px'; $('#fx').appendChild(f);
  anim(f, [{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-80%) scale(1.15)',opacity:1,offset:.25},
           {transform:'translate(-50%,-190%) scale(1)',opacity:0}], {duration:1000, easing:'ease-out'}).then(() => f.remove());
}
function burstAt(x, y, dark){
  const b = el('div', 'burst' + (dark ? ' dark' : '')); b.style.left = x + 'px'; b.style.top = y + 'px'; $('#fx').appendChild(b);
  anim(b, [{transform:'scale(.2)',opacity:1},{transform:'scale(1.7)',opacity:0}], {duration:380, easing:'ease-out'}).then(() => b.remove());
  const s = el('div', 'slash'); s.style.left = x + 'px'; s.style.top = y + 'px'; $('#fx').appendChild(s);
  const rot = dark ? 35 : -35;
  anim(s, [{transform:'rotate('+rot+'deg) scaleX(0)',opacity:1},{transform:'rotate('+rot+'deg) scaleX(1.2)',opacity:1,offset:.5},{transform:'rotate('+rot+'deg) scaleX(1.2)',opacity:0}], {duration:300}).then(() => s.remove());
}
function shakeStage(px){
  px = px || 5;
  anim($('#stage'), [{transform:'translate(0,0)'},{transform:'translate('+px+'px,'+(-px/2)+'px)'},{transform:'translate('+(-px)+'px,'+(px/2)+'px)'},
                     {transform:'translate('+(px/2)+'px,0)'},{transform:'translate(0,0)'}], {duration:300});
}
function redFlash(){ anim($('#flash'), [{opacity:0},{opacity:1,offset:.2},{opacity:0}], {duration:360}); }

async function heroAttack(dmg, streak){
  const hero = $('#heroWrap'), foe = $('#enemyWrap');
  const hp = pos(hero), ep = pos(foe);
  const tier = streak >= 5 ? 5 : (streak >= 3 ? 3 : 0);
  if(tier) hero.classList.add('charged');
  await anim(hero, [{transform:'translateX(0)'},{transform:'translateX(12px)'}], {duration:140, easing:'ease-out'});
  const a = el('div', 'arrow' + (tier ? ' c' + tier : '')); $('#fx').appendChild(a);
  const sx = hp.x - hp.w*0.38, sy = hp.y - hp.h*0.08, tx = ep.x + ep.w*0.06, ty = ep.y - ep.h*0.02;
  const ang = Math.atan2(ty - sy, tx - sx) * 180 / Math.PI;
  const flyT = anim(hero, [{transform:'translateX(12px)'},{transform:'translateX(0)'}], {duration:200, easing:'ease-in'});
  await anim(a, [{transform:'translate('+sx+'px,'+sy+'px) rotate('+ang+'deg)'},{transform:'translate('+tx+'px,'+ty+'px) rotate('+ang+'deg)'}],
             {duration: tier ? 230 : 270, easing:'ease-in', fill:'forwards'});
  a.remove();
  // 命中
  burstAt(ep.x, ep.y, false);
  floatText(ep.x, ep.y - ep.h*0.15, '-' + dmg, 'dmg' + (tier ? ' big' : ''));
  if(tier) floatText(ep.x, ep.y - ep.h*0.45, tier === 5 ? 'MAX POWER!' : 'COMBO ×' + streak, 'combo');
  shakeStage(tier ? 7 : 4);
  setBar($('#eBar'), $('#eHp'), G.enemyHp, G.enemyMax);
  await Promise.all([ flyT,
    anim(foe, [{filter:'none',transform:'translateX(0)'},{filter:'brightness(3) saturate(.3)',transform:'translateX(9px)',offset:.2},
               {filter:'brightness(1.8)',transform:'translateX(-7px)',offset:.5},{filter:'none',transform:'translateX(4px)',offset:.8},{filter:'none',transform:'translateX(0)'}], {duration:380}) ]);
  hero.classList.remove('charged');
}

async function enemyAttack(dmg){
  const hero = $('#heroWrap'), foe = $('#enemyWrap');
  const hp = pos(hero), ep = pos(foe);
  const dx = (hp.x - ep.x) * 0.62;
  const lunge = 'translate('+dx+'px,-6px) scale(1.1)';
  const a1 = foe.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate(-14px,2px) scale(1.02)',offset:.3},{transform:lunge}],
                          {duration:320, easing:'ease-in', fill:'forwards'});
  await a1.finished.catch(()=>{});
  // 命中冒險者
  burstAt(hp.x, hp.y, true);
  redFlash(); shakeStage(8);
  floatText(hp.x, hp.y - hp.h*0.2, '-' + dmg, 'hurt');
  setBar($('#pBar'), $('#pHp'), G.hp, CFG.playerMaxHp);
  const hit = anim(hero, [{filter:'none',transform:'translateX(0)'},{filter:'brightness(2) sepia(1) saturate(6) hue-rotate(-30deg)',transform:'translateX(10px)',offset:.2},
                          {filter:'none',transform:'translateX(-8px)',offset:.45},{filter:'none',transform:'translateX(5px)',offset:.7},{filter:'none',transform:'translateX(0)'}], {duration:420});
  await sleep(220);
  const a2 = foe.animate([{transform:lunge},{transform:'translate(0,0) scale(1)'}], {duration:300, easing:'ease-out', fill:'forwards'});
  await a2.finished.catch(()=>{});
  a1.cancel(); a2.cancel();
  await hit;
}

async function enemyDefeat(){
  const foe = $('#enemyWrap');
  const a = foe.animate([{opacity:1,filter:'none',transform:'scale(1)'},{opacity:1,filter:'brightness(4)',transform:'scale(1.04)',offset:.35},
                         {opacity:0,filter:'brightness(6)',transform:'scale(1.18) translateY(-10px)'}], {duration:800, easing:'ease-in', fill:'forwards'});
  await a.finished.catch(()=>{});
  foe.style.opacity = '0'; a.cancel();
}
async function heroDown(){
  const hero = $('#heroWrap');
  const a = hero.animate([{opacity:1,transform:'rotate(0)'},{opacity:.35,transform:'rotate(78deg) translate(12px,30px)'}], {duration:700, easing:'ease-in', fill:'forwards'});
  await a.finished.catch(()=>{});
  hero.style.opacity = '.35'; hero.style.transform = 'rotate(78deg) translate(12px,30px)'; a.cancel();
}
async function healHero(n){
  const hero = $('#heroWrap'), hp = pos(hero);
  G.hp = Math.min(CFG.playerMaxHp, G.hp + n);
  setBar($('#pBar'), $('#pHp'), G.hp, CFG.playerMaxHp);
  floatText(hp.x, hp.y - hp.h*0.2, '+' + n, 'heal');
  await anim(hero, [{filter:'none'},{filter:'brightness(1.8) drop-shadow(0 0 12px #6bff9a)',offset:.4},{filter:'none'}], {duration:700});
}
async function spawnEnemy(){
  const e = CFG.enemies[G.stage];
  G.enemyMax = e.hp; G.enemyHp = e.hp;
  const foe = $('#enemyWrap');
  $('#enemyImg').src = IMG[e.img];
  $('#enemyImg').style.setProperty('--es', e.scale);
  $('#eName').textContent = e.name;
  setBar($('#eBar'), $('#eHp'), e.hp, e.hp);
  foe.style.opacity = '1';
  await anim(foe, [{transform:'translateX(-70%)',opacity:0},{transform:'translateX(0)',opacity:1}], {duration:520, easing:'ease-out'});
}

/* ================= 出題 / 作答 ================= */
function renderQuestion(q){
  const meta = $('#qmeta'); meta.innerHTML = '';
  meta.appendChild(el('span', 'tag', '第 ' + G.round + ' 回合'));
  meta.appendChild(el('span', 'tag', '第 ' + q.id + ' 題'));
  if(q.category) meta.appendChild(el('span', 'tag cat', q.category));
  $('#qtext').textContent = q.question;
  $('#feedback').innerHTML = '';
  $('#qscroll').scrollTop = 0;
  const opts = $('#opts'); opts.innerHTML = '';
  q.options.forEach((t, i) => {
    const b = el('button', 'opt'); b.dataset.i = i;
    b.appendChild(el('span', 'lt', LET[i])); b.appendChild(el('span', 'tx', t));
    b.addEventListener('click', () => onAnswer(i));
    opts.appendChild(b);
  });
  $('#nextBtn').classList.add('hidden'); $('#infoTx').classList.remove('hidden');
  updateChips(); updateInfo();
}

async function nextRound(){
  if(!G.deck.length){
    const c = await showModal({
      title: '題庫已用完',
      body: '目前題庫共 ' + BANK.questions.length + ' 題，本次冒險已全部出完。\n你可以重新洗牌繼續（題目會重複出現），或結束冒險查看統計。',
      actions: [{label:'重新洗牌繼續', value:'again'}, {label:'結束冒險並看統計', value:'end', cls:'sub'}]
    });
    if(c === 'end'){ finish('exhausted'); return; }
    G.reshuffles++; refillDeck();
  }
  const qi = G.deck.pop(); G.lastQ = qi;
  G.cur = BANK.questions[qi]; G.round++; G.curStats.rounds++;
  renderQuestion(G.cur);
  G.locked = false;
}

function comboDmg(streak){
  for(const t of CFG.combo) if(streak >= t.at) return t.dmg;
  return CFG.baseDmg;
}

async function onAnswer(i){
  if(!G || G.locked || G.ended) return;
  G.locked = true; G.busy = true;
  const q = G.cur, enemy = CFG.enemies[G.stage];
  const ok = q.answers.includes(i);
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach((b, k) => {
    b.disabled = true;
    if(q.answers.includes(k)) b.classList.add('ok');
    else if(k === i) b.classList.add('bad');
    else b.classList.add('dim');
  });
  G.total++;
  let dmgDone = 0, taken = 0, msg = '';
  if(ok){
    G.correct++; G.curStats.correct++;
    G.streak++; if(G.streak > G.maxStreak) G.maxStreak = G.streak;
    dmgDone = Math.min(comboDmg(G.streak), G.enemyHp);
    G.enemyHp -= dmgDone;
    msg = G.streak >= 5 ? '連擊 ' + G.streak + '！全力一擊！造成 ' + dmgDone + ' 點傷害！'
        : G.streak >= 3 ? '連續答對 ' + G.streak + ' 題！發動強力攻擊！造成 ' + dmgDone + ' 點傷害！'
        : '冒險者發動攻擊！造成 ' + dmgDone + ' 點傷害！';
  } else {
    G.wrong++; G.curStats.wrong++; G.streak = 0;
    taken = Math.min(enemy.atk, G.hp);
    G.hp -= taken; G.curStats.taken += taken;
    G.wrongLog.push({ qi: G.lastQ, picked: i });
    msg = '回答錯誤！' + enemy.name + '發動反擊！造成 ' + taken + ' 點傷害！';
  }
  renderFeedback(ok, i, q, dmgDone, taken);
  updateChips(); updateInfo();
  setTimeout(() => { const f = $('#feedback'); f.scrollIntoView({block:'nearest', behavior:'smooth'}); }, 60);
  toast(msg, 2200);

  if(ok){
    await heroAttack(dmgDone, G.streak);
    if(G.enemyHp <= 0){
      toast(enemy.name + '已被擊敗！', 2200);
      await enemyDefeat();
      G.pending = (G.stage >= CFG.enemies.length - 1) ? 'win' : 'clear';
    } else G.pending = 'next';
  } else {
    await enemyAttack(taken);
    if(G.hp <= 0){ toast('冒險者倒下了…', 2200); await heroDown(); G.pending = 'lose'; }
    else G.pending = 'next';
  }
  const nb = $('#nextBtn');
  nb.textContent = G.pending === 'next' ? '▶ 下一題' : G.pending === 'clear' ? '🏆 領取勝利' : G.pending === 'win' ? '🏆 查看成績' : '查看結果';
  $('#infoTx').classList.add('hidden'); nb.classList.remove('hidden');
  G.busy = false;
}

function renderFeedback(ok, picked, q, dmg, taken){
  const f = $('#feedback'); f.innerHTML = '';
  const box = el('div', 'panel fb');
  box.appendChild(el('div', 'banner ' + (ok ? 'ok' : 'bad'), ok ? '答對了！' : '答錯了！'));
  if(!ok){
    const l1 = el('div'); l1.appendChild(el('span', 'lab', '你的答案：')); l1.appendChild(el('span', '', LET[picked])); box.appendChild(l1);
  }
  const l2 = el('div'); l2.appendChild(el('span', 'lab', '正確答案：'));
  l2.appendChild(el('span', 'ans', q.answers.map(k => LET[k]).join(' 或 '))); box.appendChild(l2);
  if(q.answers.length > 1) box.appendChild(el('div', 'exp', '（本題有多個可接受答案）'));
  if(q.explanation){ const e = el('div', 'exp'); e.appendChild(el('span', 'lab', '題目解析：')); e.appendChild(document.createTextNode(q.explanation)); box.appendChild(e); }
  box.appendChild(el('div', 'exp', ok ? '冒險者對敵人造成 ' + dmg + ' 點傷害。' : '敵人反擊，冒險者損失 ' + taken + ' 點 HP。'));
  f.appendChild(box);
}

async function onNext(){
  if(!G || G.busy || G.ended) return;
  const p = G.pending; G.pending = null;
  if(p === 'next'){ await nextRound(); }
  else if(p === 'clear'){ await stageClear(); }
  else if(p === 'win'){ G.stageStats.push(G.curStats); finish('win'); }
  else if(p === 'lose'){ finish('lose'); }
}

async function stageClear(){
  G.busy = true;
  const enemy = CFG.enemies[G.stage], s = G.curStats;
  G.stageStats.push(s);
  const heal = Math.min(Math.floor(CFG.playerMaxHp * CFG.healRate), CFG.playerMaxHp - G.hp);
  const body = el('div');
  const rows = [['擊敗敵人', enemy.name], ['本階段回合', s.rounds], ['答對／答錯', s.correct + ' / ' + s.wrong],
                ['正確率', s.rounds ? Math.round(s.correct / s.rounds * 100) + '%' : '-'], ['承受傷害', fmt(s.taken)], ['恢復 HP', '+' + fmt(heal)]];
  rows.forEach(r => { const d = el('div', 'kv'); d.appendChild(el('span', '', r[0])); d.appendChild(el('span', '', String(r[1]))); body.appendChild(d); });
  await showModal({ title: '第 ' + (G.stage+1) + ' 階段通過！', body, actions: [{label:'前往下一階段', value:'go'}] });
  G.stage++; G.curStats = newStageStats();
  await healHero(heal);
  toast('冒險者恢復 ' + heal + ' 點 HP！', 1800);
  await spawnEnemy();
  G.busy = false;
  await nextRound();
}

/* ================= 錯題 ================= */
function uniqueWrong(){
  const m = new Map();
  G.wrongLog.forEach(w => {
    let e = m.get(w.qi);
    if(!e){ e = { q: BANK.questions[w.qi], count: 0, picks: [] }; m.set(w.qi, e); }
    e.count++; if(!e.picks.includes(w.picked)) e.picks.push(w.picked);
  });
  return [...m.values()];
}
function reviewNode(){
  const root = el('div'); const list = uniqueWrong();
  if(!list.length){ root.appendChild(el('div', 'empty', '目前沒有錯題，繼續保持！')); return root; }
  list.forEach(e => {
    const card = el('div', 'panel rv');
    const hd = el('div', 'hd');
    hd.appendChild(el('span', 'tag', '第 ' + e.q.id + ' 題'));
    if(e.q.category) hd.appendChild(el('span', 'tag cat', e.q.category));
    hd.appendChild(el('span', 'cnt', '答錯 ' + e.count + ' 次'));
    card.appendChild(hd);
    card.appendChild(el('div', 'q', e.q.question));
    e.q.options.forEach((t, k) => {
      const isOk = e.q.answers.includes(k), isBad = e.picks.includes(k);
      const o = el('div', 'o' + (isOk ? ' ok' : (isBad ? ' bad' : '')));
      o.appendChild(el('span', 'm', LET[k] + (isOk ? ' ✓' : (isBad ? ' ✗' : ''))));
      o.appendChild(el('span', '', t)); card.appendChild(o);
    });
    if(e.q.explanation){ const x = el('div', 'e'); x.appendChild(el('b', '', '解析：')); x.appendChild(document.createTextNode(e.q.explanation)); card.appendChild(x); }
    root.appendChild(card);
  });
  return root;
}

/* ================= 結算 ================= */
function finish(kind){
  G.ended = true;
  const w = $('#resultWrap'); w.innerHTML = '';
  const title = kind === 'win' ? '🏆 挑戰成功！' : kind === 'lose' ? '💀 戰敗…' : '📚 冒險結束';
  w.appendChild(el('h1', kind === 'win' ? 'win' : 'lose', title));
  w.appendChild(el('p', 'sub', kind === 'win' ? '恭喜通關！題海魔神已被擊敗。'
    : kind === 'lose' ? '倒在第 ' + (G.stage+1) + ' 階段「' + CFG.enemies[G.stage].name + '」手下。'
    : '題庫已用完，於第 ' + (G.stage+1) + ' 階段結束冒險。'));

  const uq = uniqueWrong().length;
  const cleared = G.stageStats.length - (kind === 'win' ? 0 : 0);
  const rows = [['總答題數', G.total], ['答對題數', G.correct], ['答錯題數', G.wrong],
    ['正確率', G.total ? (G.correct / G.total * 100).toFixed(1) + '%' : '-'], ['最大連續答對', G.maxStreak],
    ['完成階段', cleared + ' / ' + CFG.enemies.length], ['不重複錯題數', uq]];
  if(G.reshuffles) rows.push(['題庫重新洗牌', G.reshuffles + ' 次（題目有重複）']);
  const st = el('div', 'panel stats');
  rows.forEach(r => { const d = el('div', 'kv'); d.appendChild(el('span', '', r[0])); d.appendChild(el('span', '', String(r[1]))); st.appendChild(d); });
  w.appendChild(st);

  w.appendChild(el('div', 'sec', '各階段戰況'));
  CFG.enemies.forEach((e, i) => {
    let s = G.stageStats[i], state;
    if(s) state = '<b class="w">擊敗</b>';
    else if(i === G.stage && kind !== 'win'){ s = G.curStats; state = '<b class="l">' + (kind === 'lose' ? '戰敗' : '中斷') + '</b>'; }
    else return;
    const p = el('div', 'panel stg');
    p.innerHTML = '';
    const l1 = el('div'); l1.innerHTML = state + '　';
    l1.appendChild(document.createTextNode('第 ' + (i+1) + ' 階段・' + e.name)); p.appendChild(l1);
    p.appendChild(el('div', '', '回合 ' + s.rounds + '　答對 ' + s.correct + '　答錯 ' + s.wrong + '　承受傷害 ' + fmt(s.taken)));
    w.appendChild(p);
  });

  w.appendChild(el('div', 'sec', '錯題回顧（' + uq + ' 題）'));
  w.appendChild(reviewNode());

  const b1 = el('button', 'btn', '重新挑戰'); b1.addEventListener('click', startGame);
  const b2 = el('button', 'btn sub', '回到標題'); b2.addEventListener('click', () => showScreen('start'));
  w.appendChild(b1); w.appendChild(b2);
  $('#result').scrollTop = 0;
  showScreen('result');
}

/* ================= 流程 ================= */
async function startGame(){
  if(!BANK || !BANK.questions.length) return;
  newGame();
  showScreen('battle');
  const hero = $('#heroWrap'); hero.style.opacity = '1'; hero.style.transform = '';
  $('#heroImg').src = IMG.hero;
  setBar($('#pBar'), $('#pHp'), G.hp, CFG.playerMaxHp);
  $('#opts').innerHTML = ''; $('#qtext').textContent = ''; $('#qmeta').innerHTML = ''; $('#feedback').innerHTML = '';
  $('#nextBtn').classList.add('hidden'); $('#infoTx').classList.remove('hidden');
  G.busy = true;
  updateChips(); updateInfo();
  await spawnEnemy();
  G.busy = false;
  toast('第 1 階段開始！', 1400);
  await nextRound();
}

async function pause(){
  if(!G || G.ended) return;
  const c = await showModal({ title: '暫停', body: '要繼續冒險，還是放棄這次挑戰回到標題？',
    actions: [{label:'繼續冒險', value:'go'}, {label:'放棄並回到標題', value:'quit', cls:'danger'}] });
  if(c === 'quit'){ G.ended = true; showScreen('start'); }
}

function setupStart(){
  const f = $('#foes'); f.innerHTML = '';
  CFG.enemies.forEach(e => { const i = el('img'); i.src = IMG[e.img]; i.alt = e.name; f.appendChild(i); });
  const n = BANK.questions.length;
  const bi = $('#bankinfo'); bi.innerHTML = '';
  const l1 = el('div'); l1.appendChild(el('b', '', '題庫：')); l1.appendChild(document.createTextNode((BANK.exam || '未命名') + (BANK.subject ? '　' + BANK.subject : ''))); bi.appendChild(l1);
  const l2 = el('div'); l2.appendChild(document.createTextNode('共 ')); l2.appendChild(el('b', '', String(n))); l2.appendChild(document.createTextNode(' 題　來源：' + BANK_SRC)); bi.appendChild(l2);
  if(BANK.skipped) bi.appendChild(el('div', 'warn', '有 ' + BANK.skipped + ' 題格式不正確，已略過。'));
  if(n < 45) bi.appendChild(el('div', 'warn', '題數較少，題庫用完時可選擇重新洗牌續戰（題目會重複）。'));
  $('#startBtn').disabled = !n;
}

/* ================= 事件 ================= */
$('#startBtn').addEventListener('click', startGame);
$('#nextBtn').addEventListener('click', onNext);
$('#pauseBtn').addEventListener('click', pause);
$('#bookBtn').addEventListener('click', () => { if(G) showModal({ title: '錯題本（本次冒險）', body: reviewNode(), actions: [{label:'關閉', value:'x', cls:'sub'}] }); });
document.addEventListener('keydown', e => {
  if(!G || $('#battle').classList.contains('hidden') || !$('#modal').classList.contains('hidden')) return;
  const k = e.key.toUpperCase(); const idx = LET.indexOf(k) >= 0 ? LET.indexOf(k) : ('1234'.indexOf(k));
  if(idx >= 0 && idx < 4 && G.cur && idx < G.cur.options.length){ onAnswer(idx); return; }
  if((e.key === 'Enter' || e.key === ' ') && !$('#nextBtn').classList.contains('hidden')){ e.preventDefault(); onNext(); }
});
// 防止 iOS 雙擊縮放與手勢縮放
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if(n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, {passive:false});

loadBank().then(setupStart);
})();
</script>
