<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>城南草原 · 像素劍士 RPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;font:12px "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#222;user-select:none}
#wrap{position:absolute;left:50%;top:50%;width:1024px;height:640px;transform-origin:center center;background:#000;overflow:hidden}
canvas#c{display:block;width:1024px;height:640px;image-rendering:pixelated}
.win{position:absolute;display:none;background:linear-gradient(#fafcff,#e8f0fb);border:1px solid #6f90c8;border-radius:3px;box-shadow:0 0 0 1px #fff inset,2px 3px 9px rgba(0,0,30,.45);z-index:10;max-height:560px}
.win .tb{background:linear-gradient(#f4f8ff,#b4cbec);color:#1c3a70;border-bottom:1px solid #7d9bd3;border-radius:2px 2px 0 0;padding:3px 7px;cursor:move;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 1px 0 #fff}
.win .tb b{cursor:pointer;padding:0 4px}
.win .bd{padding:6px;overflow-y:auto;max-height:520px}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(#ffffff,#c6d8f2);border:1px solid #6f90c8;border-radius:3px;padding:2px 8px;color:#1c3a70}
.btn:hover{background:linear-gradient(#fff,#dde6f7)}
.btn:disabled,.mini:disabled{opacity:.4;cursor:default}
.mini{font-size:11px;padding:0 4px;border:1px solid #6b7fa8;background:#e3ebfa;border-radius:2px}
table.st{width:100%;border-collapse:collapse}
table.st td{padding:1px 3px;border-bottom:1px dotted #b8c4dd}
.bn{color:#2a8a2a}
.grid{display:grid;gap:3px}
.cell{width:38px;height:38px;background:#dfe7f6;border:1px solid #8fa0c4;position:relative;display:flex;align-items:center;justify-content:center}
.cell img{width:32px;height:32px;image-rendering:pixelated}
.cell .n{position:absolute;right:1px;bottom:0;font-size:10px;font-weight:bold;color:#223;text-shadow:0 0 2px #fff,0 0 2px #fff}
.cell .r{position:absolute;left:1px;top:0;font-size:10px;font-weight:bold;color:#c03030}
.slotlb{font-size:10px;color:#667;text-align:center}
#tip{position:absolute;display:none;z-index:50;background:rgba(15,20,40,.94);color:#fff;border:1px solid #9fb3e8;padding:5px 7px;font-size:12px;max-width:230px;pointer-events:none;line-height:1.5}
#tip .t{font-weight:bold;color:#ffe9a0}
#hud{position:absolute;left:8px;top:8px;width:210px;background:linear-gradient(rgba(246,250,255,.94),rgba(190,212,242,.94));border:1px solid #6f90c8;color:#1c3a70;padding:5px 7px;z-index:5;border-radius:3px;box-shadow:0 0 0 1px #fff inset,1px 2px 5px rgba(0,0,30,.4)}
.hb{height:11px;background:#111;border:1px solid #000;margin:3px 0;position:relative}
.hb i{display:block;height:100%}
.hb span{position:absolute;left:0;right:0;top:-1px;font-size:10px;line-height:11px;text-align:center;text-shadow:0 0 2px #000}
#menu{position:absolute;right:8px;top:8px;z-index:5;display:flex;gap:4px}
#mapname{position:absolute;left:50%;top:6px;transform:translateX(-50%);color:#fff;text-shadow:1px 1px 2px #000;font-size:14px;font-weight:bold;z-index:4;pointer-events:none}
#log{position:absolute;left:8px;bottom:8px;width:360px;height:112px;background:rgba(0,0,0,.5);color:#fff;overflow-y:auto;padding:3px 5px;z-index:5;font-size:12px;scrollbar-width:none}
#log div{line-height:1.45}
#hotbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:4px;z-index:5}
.hk{width:44px;height:44px;background:rgba(20,32,64,.85);border:2px solid #6d8ad0;border-radius:3px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:bold}
.hk small{position:absolute;left:2px;top:0;font-size:10px;color:#ffe9a0}
.hk .c{position:absolute;right:2px;bottom:0;font-size:11px}
.hk img{width:32px;height:32px;image-rendering:pixelated}
.hk.dis{opacity:.45}
#help{position:absolute;right:8px;bottom:8px;color:#ddd;font-size:11px;text-shadow:1px 1px 2px #000;z-index:4;text-align:right;line-height:1.5;pointer-events:none}
.ov{position:absolute;inset:0;display:none;z-index:60;background:rgba(0,0,0,.72);color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
.ov h1{margin:0;font-size:34px;color:#ffe9a0;text-shadow:2px 2px 0 #000}
.ov input{font-size:16px;padding:4px 8px;text-align:center}
.ov .btn{font-size:16px;padding:6px 20px}
.row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dotted #b8c4dd}
.row .nm{flex:1}
.sel{background:#cfe0ff}
.dim{color:#778}
.btn.on{background:linear-gradient(#fff0b8,#f0b840);border-color:#b07a10;color:#5a3a00}
.tab{padding:2px 10px;border:1px solid #6b7fa8;background:#dde6f7;cursor:pointer}
.tab.on{background:#5b86d0;color:#fff}
</style>

<body>

  <div id="hudName" style="font-weight:bold;color:#1c3a70"></div>

<div id="shop" class="win" style="left:300px;top:70px;width:380px"><div class="tb"><span id="shopTitle">商店</span><b class="x">×</b></div><div class="bd" id="shopBody"></div></div>
<div id="refine" class="win" style="left:300px;top:70px;width:400px"><div class="tb"><span>精煉</span><b class="x">×</b></div><div class="bd" id="refineBody"></div></div>
<div id="dlg" class="win" style="left:340px;top:200px;width:300px"><div class="tb"><span id="dlgTitle"></span><b class="x">×</b></div><div class="bd"><div id="dlgText" style="margin-bottom:8px;line-height:1.6"></div><div id="dlgBtns" style="display:flex;flex-direction:column;gap:4px"></div></div></div>
<div id="modal" class="win" style="left:330px;top:120px;width:340px"><div class="tb"><span id="modalTitle"></span><b class="x">×</b></div><div class="bd" id="modalBody"></div></div>

<div id="death" class="ov"><h1>你已經死亡</h1><div>倒在草原上……</div><button class="btn" id="respBtn">回到城門重生（損失少量經驗）</button></div>
<div id="title" class="ov" style="display:flex;background:radial-gradient(#1c3a22,#05080a)">
  <h1>城南草原</h1><div style="color:#cfe;font-size:16px">像素劍士 RPG　·　普隆德拉南門（仿）</div>
  <div>角色名稱：<input id="nameIn" maxlength="10" value="劍士"></div>
  <div style="display:flex;gap:10px"><button class="btn" id="newBtn">新遊戲</button><button class="btn" id="contBtn">繼續遊戲</button></div>
  <div id="titleMsg" style="font-size:12px;color:#aab"></div>
</div>
</div>

<script>
'use strict';
/* ================= 基本工具 ================= */
const W=1024,H=640;
const cv=document.getElementById('c'),G=cv.getContext('2d');
G.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(a,b){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function shade(h,a){const[r,g,b]=hex(h);return `rgb(${clamp(r+a,0,255)},${clamp(g+a,0,255)},${clamp(b+a,0,255)})`;}
let NOW=0,S=1;
const SAVEKEY='pixel_swordsman_rpg_v1';

/* ================= 地圖 ================= */
const MW=40,MH=48,OX=MH*32+64,OY=170;
const sx=(x,y)=>(x-y)*32+OX, sy=(x,y)=>(x+y)*16+OY;
const gnd=new Uint8Array(MW*MH),blk=new Uint8Array(MW*MH);
const statics=[];
function roadCx(j){return 19.5+Math.sin(j*0.28)*2.2;}
const walk=(i,j)=>i>=0&&j>=0&&i<MW&&j>=0&&j<MH&&!blk[j*MW+i];
const NPCS=[
 {name:'治療師',role:'heal',x:18,y:4,look:{hair:'#f2d27a',armor:{c:'#f4f4f8',trim:'#d8b030'},garment:{c:'#dcdcf4'},shoes:{c:'#c8c8d8'},headUp:{k:'band',c:'#d8b030'}}},
 {name:'轉職官',role:'job',x:22,y:4,look:{hair:'#3a3a44',knight:true,armor:{c:'#2f56b0',trim:'#e6c040'},weapon:{blade:'#e8ecf4',hilt:'#c9a227',len:12},shield:{c:'#2f56b0',rim:'#e6c040',shape:'kite'},headUp:{k:'plume',c:'#d8dfe8',p:'#d03030'},garment:{c:'#c03030'},shoes:{c:'#8e9aaa'}}},
 {name:'道具商',role:'shopI',x:14,y:5,look:{hair:'#a0602a',armor:{c:'#5a9a4a',trim:'#e8e0c8'},headUp:{k:'cap',c:'#c8a040'},shoes:{c:'#6a4528'}}},
 {name:'武具商',role:'shopE',x:26,y:5,look:{hair:'#2a2a2a',armor:{c:'#9aa6b4',pat:'chain'},weapon:{blade:'#d6dde8',hilt:'#7a5530',len:9},headUp:{k:'helm',c:'#b8c4d2'},shoes:{c:'#6a4528'}}},
 {name:'精煉師',role:'smith',x:18,y:7,look:{hair:'#7a3a1a',armor:{c:'#8a5a2a',trim:'#222'},headMid:{k:'shades'},shoes:{c:'#4a3418'},weapon:{blade:'#888',hilt:'#5a3a1a',len:5}}},
 {name:'城門衛兵',role:'guard',x:17,y:2,look:{hair:'#444',knight:true,armor:{c:'#c9d3de',trim:'#5a7ab0'},weapon:{blade:'#e6edf5',hilt:'#c9a227',len:12},shield:{c:'#aab4c0',rim:'#556',shape:'round'},headUp:{k:'helm',c:'#b8c4d2'},shoes:{c:'#8e9aaa'}}},
 {name:'城門衛兵',role:'guard',x:22,y:2,look:{hair:'#444',knight:true,armor:{c:'#c9d3de',trim:'#5a7ab0'},weapon:{blade:'#e6edf5',hilt:'#c9a227',len:12},shield:{c:'#aab4c0',rim:'#556',shape:'round'},headUp:{k:'helm',c:'#b8c4d2'},shoes:{c:'#8e9aaa'}}}
];
(function buildMap(){
 for(let j=0;j<MH;j++)for(let i=0;i<MW;i++){
  let t=0;
  if(j<=8&&i>=12&&i<=27)t=2;
  else if(j>8&&j<MH-2&&Math.abs(i+0.5-roadCx(j))<2.1)t=1;
  if(((i-31)*(i-31))/12+((j-22)*(j-22))/14<1)t=3;
  gnd[j*MW+i]=t; if(t===3)blk[j*MW+i]=1;
 }
 for(let j=0;j<2;j++)for(let i=0;i<MW;i++){
  const id=j*MW+i;
  if(i>=17&&i<=22){gnd[id]=2;if(j===0){blk[id]=1;statics.push({i,j,k:'door'});}continue;}
  const tower=(i>=15&&i<=16)||(i>=23&&i<=24);
  blk[id]=1;statics.push({i,j,k:tower?'tower':'wall'});
 }
 for(let j=2;j<MH;j++)for(let i=0;i<MW;i++){
  const id=j*MW+i; if(blk[id]||gnd[id]!==0)continue;
  const h=hash(i,j),border=(i<=1||i>=MW-2||j>=MH-2);
  if(border||(j>=10&&h>0.945)||(j<10&&(i<7||i>32)&&h>0.9)){blk[id]=1;statics.push({i,j,k:'tree',v:Math.floor(hash(j,i)*2)});}
  else if(h>0.86&&h<=0.91)statics.push({i,j,k:'bush'});
 }
 for(const n of NPCS)blk[n.y*MW+n.x]=1;
 statics.forEach(s=>s.depth=s.i+s.j+1);
 statics.sort((a,b)=>a.depth-b.depth);
})();

/* ---- A* ---- */
function findPath(si,sj,gi,gj){
 if(!walk(gi,gj))return null;
 if(si===gi&&sj===gj)return[[gi,gj]];
 const N=MW*MH,gs=new Float32Array(N).fill(1e9),cl=new Uint8Array(N),came=new Int32Array(N).fill(-1);
 const hf=(x,y)=>{const dx=Math.abs(x-gi),dy=Math.abs(y-gj);return Math.max(dx,dy)+0.414*Math.min(dx,dy);};
 let open=[si+sj*MW];gs[si+sj*MW]=0;const fs=new Map();fs.set(si+sj*MW,hf(si,sj));
 let it=0;
 while(open.length&&it++<4000){
  let bi=0,bf=1e9;for(let k=0;k<open.length;k++){const f=fs.get(open[k]);if(f<bf){bf=f;bi=k;}}
  const cur=open.splice(bi,1)[0];cl[cur]=1;
  const ci=cur%MW,cj=(cur/MW)|0;
  if(ci===gi&&cj===gj){const p=[];let c=cur;while(c!==si+sj*MW){p.push([c%MW,(c/MW)|0]);c=came[c];}return p.reverse();}
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
   if(!dx&&!dy)continue;const ni=ci+dx,nj=cj+dy;
   if(!walk(ni,nj))continue;
   if(dx&&dy&&(!walk(ci+dx,cj)||!walk(ci,cj+dy)))continue;
   const nid=ni+nj*MW;if(cl[nid])continue;
   const ng=gs[cur]+(dx&&dy?1.414:1);
   if(ng<gs[nid]){gs[nid]=ng;came[nid]=cur;fs.set(nid,ng+hf(ni,nj));if(!open.includes(nid))open.push(nid);}
  }
 }
 return null;
}

/* ================= 預繪圖像（地面/方塊/樹） ================= */
function mkTile(kind,seed){
 const c=document.createElement('canvas');c.width=64;c.height=32;const x=c.getContext('2d');const im=x.createImageData(64,32);
 for(let py=0;py<32;py++)for(let px=0;px<64;px++){
  if(Math.abs(px+0.5-32)/32+Math.abs(py+0.5-16)/16>1)continue;
  const r=hash((px>>1)+seed*17,(py>>1)+seed*31+kind*101);let col;
  if(kind===0){const r2=hash(px+seed*13,py*3+7),r3=hash(px*5+seed,py+11);col=r<0.25?'#4a9433':r<0.6?'#55a23a':r<0.9?'#62b044':'#76c250';if(r2>0.9)col='#3e8230';else if(r3>0.94)col='#8ad65c';}
  else if(kind===1){col=r<0.3?'#c4a064':r<0.8?'#cfab70':'#d9b87f';if(r>0.96)col='#a88650';}
  else if(kind===2){
   const u=((px+0.5-32)/32+(py+0.5-16)/16)/2+0.5,v=((py+0.5-16)/16-(px+0.5-32)/32)/2+0.5;
   const fu=(u*2)%1,fv=(v*2)%1,mort=(fu<0.09||fv<0.09);
   const sr=hash(Math.floor(u*2)+Math.floor(v*2)*2+seed*5,seed*9+3);
   col=mort?'#9c9684':(sr<0.33?'#d9d3c1':sr<0.66?'#cfc9b6':'#e2dccb');
   if(!mort&&r>0.95)col='#c4bea9';
  } else col=r<0.12?'#7db4f2':r<0.6?'#3f7fd0':'#3a76c6';
  const[R,Gc,B]=hex(col),k=(py*64+px)*4;im.data[k]=R;im.data[k+1]=Gc;im.data[k+2]=B;im.data[k+3]=255;
 }
 x.putImageData(im,0,0);return c;
}
function mkBlock(Hh,top,l,r,line,plank,cap){
 const w=64,h=32+Hh,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const im=x.createImageData(w,h);
 const mask=new Uint8Array(w*h),face=new Uint8Array(w*h),half=new Float32Array(w);
 for(let px=0;px<w;px++)half[px]=16*(1-Math.abs(px+0.5-32)/32);
 for(let py=0;py<h;py++)for(let px=0;px<w;px++){
  const y=py+0.5,hf=half[px];
  if(y>=16-hf&&y<=16+hf+Hh){mask[py*w+px]=1;face[py*w+px]=y<=16+hf?0:(px<32?1:2);}
 }
 for(let py=0;py<h;py++)for(let px=0;px<w;px++){
  const id=py*w+px;if(!mask[id])continue;
  const edge=!(px>0&&mask[id-1])||!(px<w-1&&mask[id+1])||!(py>0&&mask[id-w])||!(py<h-1&&mask[id+w]);
  const f=face[id],rr=hash(px>>1,py>>1);let col;
  if(edge)col='#2a2a34';
  else if(f===0){col=rr<0.5?top:shade(top,-10);}
  else{
   const v=Math.floor(py+0.5-(16+half[px])),row=Math.floor(v/8),off=(row%2)*6;
   const joint=plank?(px%8===0||(v>6&&v<10)||(v>Hh-14&&v<Hh-10)):((v%8===0)||((px+off)%12===0));
   col=joint?line:(rr<0.5?(f===1?l:r):shade(f===1?l:r,-8));
   if(cap&&v<5)col=f===1?shade(l,-30):shade(r,-30);
  }
  let rgb=col.startsWith('rgb')?col.match(/\d+/g).map(Number):hex(col);
  const k=id*4;im.data[k]=rgb[0];im.data[k+1]=rgb[1];im.data[k+2]=rgb[2];im.data[k+3]=255;
 }
 x.putImageData(im,0,0);return c;
}
function outlineImg(c,col){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');
 const s=document.createElement('canvas');s.width=c.width;s.height=c.height;const y=s.getContext('2d');y.drawImage(c,0,0);y.globalCompositeOperation='source-in';y.fillStyle=col||'#16301a';y.fillRect(0,0,s.width,s.height);
 for(const[a,b]of[[-2,0],[2,0],[0,-2],[0,2]])x.drawImage(s,a,b);x.drawImage(c,0,0);return o;}
function mkSprite(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.scale(2,2);
 const R=(a,b,ww,hh,col)=>{x.fillStyle=col;x.fillRect(a,b,ww,hh);};
 const E=(cx,cy,rx,ry,col)=>{x.fillStyle=col;for(let y=-ry;y<=ry;y++){const hw=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry+0.0001)));x.fillRect(cx-hw,cy+y,hw*2,1);}};
 fn(R,E);return c;}
const imgs={};
function buildImages(){
 imgs.tiles=[0,1,2,3].map(k=>[0,1,2,3].map(s=>mkTile(k,s)));
 imgs.wall=mkBlock(56,'#d0cab8','#b8b2a2','#948e80','#76715f',false,true);
 imgs.tower=mkBlock(120,'#6a7a9c','#aab4c4','#848ea0','#6a7384',false,true);
 imgs.door=mkBlock(64,'#7a4e26','#8a5a2a','#6a4220','#2a1a0c',true,false);
 imgs.tree=[0,1].map(v=>outlineImg(mkSprite(64,96,(R,E)=>{

function spawnPos(z){for(let n=0;n<80;n++){const x=ri(z[0],z[2]),y=ri(z[1],z[3]);if(walk(x,y)&&y>=9)return[x+0.5,y+0.5];}return[20.5,20.5];}
function initMonsters(){mons.length=0;for(const[t,n,z]of SPAWNS)for(let k=0;k<n;k++){const p=spawnPos(z),d=MON[t];mons.push({id:monId++,type:t,x:p[0],y:p[1],sx0:p[0],sy0:p[1],z,hp:d.hp,dead:false,state:'idle',angry:false,nextAtk:0,wanderAt:NOW+rnd(0,4000),goal:null,flash:0,stun:0,flip:false,atkAnim:0,prov:null});}}

const SK={

const EQSLOTS=['headUp','headMid','headLow','armor','weapon','shield','garment','shoes','acc1','acc2'];
function mkEquip(id){return{id,refine:0,cards:[]};}
function newPlayer(name){
 const p={name,job:'sword',lv:1,exp:0,zeny:500,stats:{str:1,agi:1,vit:1,int:1,dex:1,luk:1},stPts:48,skPts:0,sk:{bash:1,prov:1,recov:1,charge:0},hp:1,sp:1,inv:[],equip:{},x:20.5,y:5.5};
 EQSLOTS.forEach(s=>p.equip[s]=null);
 p.equip.weapon=mkEquip('w_dagger');p.equip.armor=mkEquip('a_shirt');
 p.inv.push({id:'rpot',count:10});
 return p;

function initRuntime(){
 Object.assign(P,{path:[],front:true,mirror:false,phase:0,moving:false,target:null,pending:null,goal:null,nextAtk:0,atkAnim:-9999,repathAt:0,dead:false,cd:{},potCd:0});
 derive();P.hp=clamp(P.hp,1,P.d.maxhp);P.sp=clamp(P.sp,0,P.d.maxsp);
}
const needExp=lv=>Math.floor(8*Math.pow(lv,2.3)+10);
const stCost=v=>Math.floor((v-1)/10)+2;
function calcBonus(){
 const b={str:0,agi:0,vit:0,int:0,dex:0,luk:0,atk:0,def:0,maxhp:0,maxsp:0,hit:0,flee:0,crit:0,wpn:0};
 const add=o=>{for(const k in o)b[k]+=o[k];};
 for(const s of EQSLOTS){const it=P.equip[s];if(!it)continue;const d=ITEMS[it.id];
  if(d.t==='weapon')b.wpn+=d.atk+it.refine*4;
  if(d.def)b.def+=d.def;if(d.t!=='weapon'&&d.t!=='acc')b.def+=it.refine;
  if(d.bonus)add(d.bonus);(it.cards||[]).forEach(c=>add(ITEMS[c].bonus));}
 return b;
}
function derive(){
 const b=calcBonus(),s=P.stats,lv=P.lv,kn=P.job==='knight',d={};
 STATK.forEach(k=>d[k]=s[k]+b[k]);
 d.maxhp=Math.floor((60+lv*28+lv*lv*0.6)*(1+d.vit/100)*(kn?1.25:1))+b.maxhp;
 d.maxsp=Math.floor((15+lv*5)*(1+d.int/100))+b.maxsp;
 d.atk=d.str+Math.pow(Math.floor(d.str/10),2)+Math.floor(d.dex/5)+Math.floor(d.luk/3)+Math.floor(lv/4)+b.atk;
 d.wpn=b.wpn;d.hdef=b.def;d.sdef=Math.floor(d.vit/2);
 d.hit=lv+d.dex+b.hit;d.flee=10+lv+d.agi+b.flee;d.crit=Math.round((1+d.luk*0.3+b.crit)*10)/10;
 d.aspd=Math.max(300,Math.round(900-(kn?50:0)-d.agi*4-d.dex*1.5));
 P.d=d;P.hp=Math.min(P.hp,d.maxhp);P.sp=Math.min(P.sp,d.maxsp);
}
function playerLook(){
 const E=P.equip,lk=s=>E[s]?ITEMS[E[s].id].look:null;
 return{hair:'#7a4a2a',knight:P.job==='knight',weapon:lk('weapon'),armor:lk('armor')||{c:'#4a78b8'},shield:lk('shield'),headUp:lk('headUp'),headMid:lk('headMid'),headLow:lk('headLow'),garment:lk('garment'),shoes:lk('shoes')};
}

/* ================= 背包 ================= */
const MAXINV=60;
function invAdd(it){
 if(ITEMS[it.id].stack){const f=P.inv.find(e=>e.id===it.id);if(f){f.count+=it.count||1;return true;}}
 if(P.inv.length>=MAXINV)return false;P.inv.push(it);return true;
}
function invRemove(it,n){
 if(ITEMS[it.id].stack&&n!==undefined&&it.count>n){it.count-=n;return;}
 const i=P.inv.indexOf(it);if(i>=0)P.inv.splice(i,1);
}
const countItem=id=>{const f=P.inv.find(e=>e.id===id);return f?f.count:0;};
function takeItem(id,n){const f=P.inv.find(e=>e.id===id);if(!f||f.count<n)return false;invRemove(f,n);return true;}
function giveItem(id,n){const d=ITEMS[id];return isEquip(d)?invAdd(mkEquip(id)):invAdd({id,count:n||1});}
function equipItem(it){
 const d=ITEMS[it.id];
 if(P.lv<d.lv){log(`需要等級 ${d.lv} 才能裝備`,'#f99');return;}
 if(d.job==='knight'&&P.job!=='knight'){log('只有騎士可以裝備','#f99');return;}
 let slot=d.t;if(d.t==='acc')slot=!P.equip.acc1?'acc1':!P.equip.acc2?'acc2':'acc1';
 const old=P.equip[slot];invRemove(it);P.equip[slot]=it;if(old)invAdd(old);refreshUI();
}
function unequip(slot){const it=P.equip[slot];if(!it)return;if(!invAdd(it)){log('背包已滿','#f99');return;}P.equip[slot]=null;refreshUI();}
function useItem(it){
 const d=ITEMS[it.id];if(P.dead||NOW<P.potCd)return;
 if(d.hp){if(P.hp>=P.d.maxhp){log('HP 已滿');return;}P.hp=Math.min(P.d.maxhp,P.hp+d.hp);flo(P.x,P.y,'+'+d.hp,'#6f6',1.1);}
 else if(d.sp){if(P.sp>=P.d.maxsp){log('SP 已滿');return;}P.sp=Math.min(P.d.maxsp,P.sp+d.sp);flo(P.x,P.y,'+'+d.sp,'#6af',1.1);}
 else return;
 P.potCd=NOW+400;invRemove(it,1);refreshUI();
}

/* ================= 戰鬥 ================= */
const floaters=[];
function flo(x,y,txt,col,size){floaters.push({x,y,txt,col,t0:NOW,sz:size||1});}
function monDef(m){const t=MON[m.type];let def=t.def,atkM=1;if(m.prov&&NOW<m.prov.until){def*=1-m.prov.def;atkM=1+m.prov.atk;}return{def,flee:t.flee,atkM};}
function playerDmg(m,mult,forceHit){
 const d=P.d,md=monDef(m);
 if(!forceHit&&Math.random()*100>=clamp(80+d.hit-md.flee,5,95))return{miss:true};
 const crit=!forceHit&&Math.random()*100<d.crit;
 let dmg=(d.atk+d.wpn*(crit?1.1:rnd(0.8,1.1)))*mult;
 dmg=crit?dmg*1.4:dmg-md.def;
 return{dmg:Math.max(1,Math.floor(dmg)),crit};
}
function damageMon(m,res,big){
 if(m.dead)return;
 if(res.miss){flo(m.x,m.y,'Miss','#ddd',0.9);return;}
 m.hp-=res.dmg;m.flash=NOW+120;m.angry=true;m.state='chase';m.nextAtk=Math.max(m.nextAtk,NOW+350);
 flo(m.x,m.y,String(res.dmg),res.crit?'#ffe040':'#fff',res.crit||big?1.4:1);
 if(m.hp<=0)killMon(m);
}
function killMon(m){
 const t=MON[m.type];m.dead=true;m.hp=0;m.deadAt=NOW;m.respawnAt=NOW+t.rs*1000;
 if(P.target===m){P.target=null;P.pending=null;}
 log(`擊倒 ${t.n}！獲得 ${t.exp} 經驗值`,'#ffe9a0');gainExp(t.exp);
 for(const[id,ch]of t.loot){if(Math.random()<ch){const it=isEquip(ITEMS[id])?mkEquip(id):{id,count:1};
  let x=m.x+rnd(-1,1),y=m.y+rnd(-1,1);if(!walk(Math.floor(x),Math.floor(y))){x=m.x;y=m.y;}
  drops.push({x,y,it,t0:NOW});}}
}
function gainExp(n){
 if(P.lv>=40)return;P.exp+=n;
 while(P.lv<40&&P.exp>=needExp(P.lv)){P.exp-=needExp(P.lv);P.lv++;P.stPts+=Math.floor(P.lv/5)+3;P.skPts+=1;derive();P.hp=P.d.maxhp;P.sp=P.d.maxsp;
  log(`升級了！Base Lv ${P.lv}（屬性點 +${Math.floor(P.lv/5)+3}，技能點 +1）`,'#6ff');flo(P.x,P.y,'LEVEL UP!','#6ff',1.5);}
 if(P.lv>=40)P.exp=0;refreshUI();
}
function normalAttack(m){P.nextAtk=NOW+P.d.aspd;P.atkAnim=NOW;damageMon(m,playerDmg(m,1));}
function castSkill(id,m){
 const s=SK[id],L=P.sk[id];P.pending=null;
 if(!L)return;
 if(s.knight&&P.job!=='knight'){log('只有騎士可以使用','#f99');return;}
 if(P.cd[id]&&NOW<P.cd[id]){log(`${s.n} 冷卻中`);return;}
 const cost=s.cost(L);if(P.sp<cost){log('SP 不足','#f99');return;}
 P.sp-=cost;P.nextAtk=NOW+P.d.aspd*0.8;P.atkAnim=NOW;flo(P.x,P.y,s.n+'！','#ffb060',1);
 if(id==='bash')damageMon(m,playerDmg(m,s.mult(L),true),true);
 else if(id==='prov'){m.prov={until:NOW+30000,def:(5+5*L)/100,atk:(2+3*L)/100};m.angry=true;m.state='chase';flo(m.x,m.y,'挑釁','#f66',0.9);}
 else if(id==='charge'){
  const dx=P.x-m.x,dy=P.y-m.y,dd=Math.hypot(dx,dy)||1;const nx=m.x+dx/dd*1.1,ny=m.y+dy/dd*1.1;
  if(walk(Math.floor(nx),Math.floor(ny))){P.x=nx;P.y=ny;}P.path=[];
  P.cd.charge=NOW+3000;m.stun=NOW+1500;damageMon(m,playerDmg(m,s.mult(L),true),true);
 }
 refreshUI();
}
function useSkill(id){
 if(P.dead)return;const s=SK[id],L=P.sk[id];
 if(s.passive)return;
 if(!L){log(`尚未學習「${s.n}」`);return;}
 if(s.knight&&P.job!=='knight'){log('「'+s.n+'」需要轉職為騎士','#f99');return;}
 const t=P.target&&!P.target.dead?P.target:(hover&&hover.kind==='mon'?hover.ref:null);
 if(!t){log('請先選擇目標怪物');return;}
 P.target=t;P.pending={id};
}
function playerDie(){
 setAuto(false);P.dead=true;P.hp=0;P.target=null;P.pending=null;P.path=[];P.goal=null;
 mons.forEach(m=>{if(!m.dead){m.angry=false;m.state='idle';}});

function respawn(){
 P.dead=false;P.x=20.5;P.y=5.5;P.hp=Math.ceil(P.d.maxhp*0.5);P.exp=Math.max(0,P.exp-Math.floor(needExp(P.lv)*0.05));
 $('death').style.display='none';log('在普隆德拉城門重生了。');saveGame(true);refreshUI();
}
function monAttack(m){
 const t=MON[m.type],md=monDef(m);m.nextAtk=NOW+t.aspd;m.atkAnim=NOW;
 const d=P.d;if(Math.random()*100>=clamp(80+t.hit-d.flee,5,95)){flo(P.x,P.y,'Miss','#9cf',0.9);return;}
 let dmg=rnd(t.atk[0],t.atk[1])*md.atkM;dmg=dmg*(4000+d.hdef)/(4000+d.hdef*10)-d.sdef;dmg=Math.max(1,Math.floor(dmg));
 P.hp-=dmg;flo(P.x,P.y,String(dmg),'#ff5050',1.2);
 if(P.hp<=0)playerDie();
}
const mwalk=(x,y)=>{const i=Math.floor(x),j=Math.floor(y);return walk(i,j)&&j>=9;};
function mmove(m,tx,ty,spd,dt){
 const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);if(d<0.05)return false;
 const st=Math.min(d,spd*dt),nx=m.x+dx/d*st,ny=m.y+dy/d*st;
 if(mwalk(nx,m.y))m.x=nx;if(mwalk(m.x,ny))m.y=ny;m.flip=(dx-dy)<0;return true;
}
function updMon(m,dt){
 const t=MON[m.type];
 if(m.dead){if(NOW>=m.respawnAt){const p=spawnPos(m.z);Object.assign(m,{x:p[0],y:p[1],sx0:p[0],sy0:p[1],hp:t.hp,dead:false,state:'idle',angry:false,prov:null,stun:0,goal:null});}return;}
 if(NOW<m.stun)return;
 const d=Math.hypot(m.x-P.x,m.y-P.y),home=Math.hypot(m.x-m.sx0,m.y-m.sy0);
 if(!P.dead&&m.state!=='chase'&&((t.aggr&&d<=7&&P.y>=9)))m.state='chase';
 if(m.state==='chase'){
  if(P.dead||home>28||(d>22&&!m.angry)){m.state='idle';m.angry=false;return;}
  if(d<=1.35){if(NOW>=m.nextAtk&&P.y>=0)monAttack(m);m.flip=((P.x-m.x)-(P.y-m.y))<0;}
  else mmove(m,P.x,P.y,t.spd*(m.prov&&NOW<m.prov.until?1:1),dt);
 }else{
  if(NOW>m.wanderAt){m.wanderAt=NOW+rnd(2500,6500);const gx=m.sx0+rnd(-3,3),gy=m.sy0+rnd(-3,3);m.goal=mwalk(gx,gy)?[gx,gy]:null;}
  if(m.goal){if(!mmove(m,m.goal[0],m.goal[1],t.spd*0.5,dt))m.goal=null;}
 }
}

/* ================= 存檔 ================= */
function saveGame(manual){
 if(!P)return;
 try{
  localStorage.setItem(SAVEKEY,JSON.stringify({v:1,name:P.name,job:P.job,lv:P.lv,exp:P.exp,zeny:P.zeny,stats:P.stats,stPts:P.stPts,skPts:P.skPts,sk:P.sk,hp:Math.max(1,P.hp),sp:P.sp,inv:P.inv,equip:P.equip,x:P.x,y:P.y,gotSpear:P.gotSpear}));
  if(manual)log('存檔完成。','#9fe8a0');
 }catch(e){log('存檔失敗（瀏覽器不允許儲存）','#f99');}
}
function loadGame(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(!s)return false;
  const p=newPlayer(s.name);
  Object.assign(p,{job:s.job,lv:s.lv,exp:s.exp,zeny:s.zeny,stats:s.stats,stPts:s.stPts,skPts:s.skPts,sk:Object.assign(p.sk,s.sk),hp:s.hp,sp:s.sp,x:s.x,y:s.y,gotSpear:s.gotSpear});
  const ok=it=>it&&ITEMS[it.id];
  p.inv=(s.inv||[]).filter(ok);EQSLOTS.forEach(k=>{p.equip[k]=ok(s.equip[k])?s.equip[k]:null;});
  P=p;return true;
 }catch(e){return false;}
}

/* ================= 滑鼠與輸入 ================= */
const cam={x:0,y:0};let mouse={x:0,y:0},hover=null;
function pick(mx,my){
 let best=null,bd=-1e9;
 for(const m of mons){if(m.dead)continue;const t=MON[m.type],s=t.sz||1,fx=sx(m.x,m.y)-cam.x,fy=sy(m.x,m.y)-cam.y,w=t.hb[0]*s*(s>1?0.8:1),h=t.hb[1]*s*(s>1?0.8:1);
  if(mx>=fx-w/2&&mx<=fx+w/2&&my>=fy-h&&my<=fy+6&&m.x+m.y>bd){bd=m.x+m.y;best={kind:'mon',ref:m};}}
 if(best)return best;
 for(const d of drops){const fx=sx(d.x,d.y)-cam.x,fy=sy(d.x,d.y)-cam.y;if(Math.abs(mx-fx)<16&&my>fy-28&&my<fy+8)return{kind:'drop',ref:d};}
 for(const n of NPCS){const fx=sx(n.x+0.5,n.y+0.5)-cam.x,fy=sy(n.x+0.5,n.y+0.5)-cam.y;if(Math.abs(mx-fx)<20&&my>fy-62&&my<fy+6)return{kind:'npc',ref:n};}
 const px=mx+cam.x-OX,py=my+cam.y-OY;
 return{kind:'ground',x:(px/32+py/16)/2,y:(py/16-px/32)/2};
}
function mpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}

 if(h.kind==='mon'){P.target=h.ref;P.pending=null;P.goal=null;P.repathAt=0;}
 else if(h.kind==='drop'){P.target=null;P.pending=null;P.goal={k:'drop',ref:h.ref};const p=findPath(Math.floor(P.x),Math.floor(P.y),Math.floor(h.ref.x),Math.floor(h.ref.y));P.path=p||[];}
 else if(h.kind==='npc'){P.target=null;P.pending=null;P.goal={k:'npc',ref:h.ref};
  let best=null,bd=1e9;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const i=h.ref.x+dx,j=h.ref.y+dy;if((dx||dy)&&walk(i,j)){const d=Math.hypot(i+0.5-P.x,j+0.5-P.y);if(d<bd){bd=d;best=[i,j];}}}
  P.path=best?(findPath(Math.floor(P.x),Math.floor(P.y),best[0],best[1])||[]):[];}
 else{P.target=null;P.pending=null;P.goal=null;const p=findPath(Math.floor(P.x),Math.floor(P.y),Math.floor(h.x),Math.floor(h.y));if(p)P.path=p;}
});

/* ================= 角色繪製（像素） ================= */
function drawHuman(g,fx,fy,L,o){
 g.save();g.translate(Math.round(fx),Math.round(fy));
 if(!o.noShadow){g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,0,13,6,0,0,7);g.fill();}
 g.scale(2,2);g.translate(-16,-30);
 if(o.dead){g.translate(16,28);g.rotate(Math.PI/2);g.translate(-16,-28);}
 if(o.mirror){g.translate(32,0);g.scale(-1,1);}
 const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
 const f=o.front,skin='#f0c8a0',hair=L.hair||'#7a4a2a',pants='#3d4560';
 const step=o.moving?Math.floor(o.phase)%2:0,b=(o.moving&&step===1)?-1:0;
 const ll=(o.moving&&step===1)?1:0,rl=(o.moving&&step===0)?1:0;
 const ar=L.armor||{c:'#4a78b8'},sh=L.shoes?L.shoes.c:'#5a4030';
 if(L.garment&&f){R(10,14+b,12,13,L.garment.c);R(10,25+b,12,2,shade(L.garment.c,-30));}
 R(12,22,3,5-ll,pants);R(17,22,3,5-rl,pants);
 R(11,27-ll,5,3,sh);R(16,27-rl,5,3,sh);
 // 軀幹
 R(11,13+b,10,9,ar.c);
 if(ar.trim){R(11,13+b,10,1,ar.trim);R(15,14+b,2,8,ar.trim);R(11,21+b,10,1,ar.trim);}
 if(ar.pat){for(let a=11;a<21;a+=2)for(let c=13;c<21;c+=2)R(a+((c/2)%2),c+b,1,1,'#6a7684');}
 R(11,20+b,10,1,'#4a3418');
 R(9,14+b,2,6,ar.c);R(21,14+b,2,6,ar.c);R(9,20+b,2,2,skin);R(21,20+b,2,2,skin);
 if(L.knight){R(8,13+b,4,3,'#c9d3de');R(20,13+b,4,3,'#c9d3de');R(8,13+b,4,1,'#fff');R(20,13+b,4,1,'#fff');}
 if(L.garment&&!f){R(10,13+b,12,14,L.garment.c);R(10,25+b,12,2,shade(L.garment.c,-30));R(10,13+b,12,1,shade(L.garment.c,-50));}

 if(localStorage.getItem(SAVEKEY)&&!confirm('已有存檔，開新遊戲會覆蓋它。確定嗎？'))return;
 P=newPlayer(nm);P.hp=P.sp=9999;startGame();derive();P.hp=P.d.maxhp;P.sp=P.d.maxsp;saveGame();};
$('contBtn').onclick=()=>{if(loadGame())startGame();else $('titleMsg').textContent='找不到存檔。';};
addEventListener('beforeunload',()=>{if(gameOn&&!P.dead)saveGame();});
try{if(!localStorage.getItem(SAVEKEY))$('contBtn').disabled=true;else{const s=JSON.parse(localStorage.getItem(SAVEKEY));$('titleMsg').textContent=`存檔：${s.name}　${s.job==='knight'?'騎士':'劍士'} Lv${s.lv}`;$('nameIn').value=s.name;}}catch(e){$('contBtn').disabled=true;}
buildImages();
requestAnimationFrame(frame);
</script>
</body>
</html>
